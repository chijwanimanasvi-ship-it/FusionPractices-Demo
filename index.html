tails unclear).", "gaps": "PL/SQL, tuning, APEX, relevant duration and optional skills all need evidence.", "flags": "Skills section is blank. Three total years are stated. Confirm project dates and Pune availability.", "dup": null, "points": [0, 0, 0, 0, 0, 0, 0]}], "replies": [["C-01", "R-01", "Email", "Hi, can we reschedule tomorrow's interview to Friday afternoon? I have a client call at the same time."], ["C-02", "R-12", "LinkedIn", "Thanks for reaching out. What is the salary range for this role?"], ["C-03", "R-02", "Email", "I am serving a 60 day notice period, my last working day is 20 Jan. Can I still apply?"], ["C-04", "R-07", "Email", "Thank you, but I am not interested. I have accepted another offer."], ["C-05", "R-15", "WhatsApp", "Hmm, what about the other thing we spoke about last time? Let me know."], ["C-06", "R-14", "Email", "My current CTC is 22 LPA and I expect 30 LPA. Is this negotiable? If not, I will have to decline."], ["C-07", "R-03", "Email", "The recruiter told me this role is fully remote, but the JD says Pune hybrid. This is misleading and I am unhappy."], ["C-08", "R-08", "LinkedIn", "Please share the JD again along with the location and the interview process."]], "transcript": [["Interviewer", "Welcome. Please introduce yourself and your recent work."], ["Candidate", "I have 5 years in Oracle, mostly PL/SQL back-end for a banking client. In the last 18 months I also built two APEX applications for loan tracking."], ["Interviewer", "Tell me about a PL/SQL package you designed recently."], ["Candidate", "I built a repayment-calculation package with about 15 procedures. I used bulk collect and forall for batch processing and wrote exception handling with a common logging table. It cut the nightly run from 40 minutes to 8."], ["Interviewer", "A query is slow in production. How do you approach it?"], ["Candidate", "I check the explain plan first, look for full table scans, then check indexes and statistics. I have used hints a few times. I have not used AWR much, our DBA team handled that."], ["Interviewer", "What would you do if the optimizer ignores your index?"], ["Candidate", "Maybe gather fresh stats... I think we could also force it with a hint. I am not fully sure about other reasons."], ["Interviewer", "Moving to APEX. How do you handle authorization in an app?"], ["Candidate", "We used authorization schemes based on roles stored in a table. Page-level and button-level checks. I also used session state protection."], ["Interviewer", "Have you integrated APEX with REST services?"], ["Candidate", "Yes, I used REST Data Sources to call a credit-score API and ORDS to expose two endpoints. Authentication was OAuth2 with client credentials."], ["Interviewer", "How do you work with the team and handle production issues?"], ["Candidate", "I was on rotation for support. Once a month-end job failed at 2 am; I traced it to a locked table, fixed it, and wrote a short RCA for the client."], ["Interviewer", "Notice period and expectations?"], ["Candidate", "30 days notice. I am looking for more exposure to Oracle Cloud and Fusion projects."]], "raw": [["Aarav M", "Consultant", "screening done", null, "25-10-2026", "Shobika", null], ["Sneha I", null, "Offer Declined", "06-10-2026", "26-10-2026", "Priya", null], ["Rohan D", "Naukri", "Screen Reject", "20/10/26", "04-11-2026", null, "Salary expectation"], ["Priya N", "Job Portal", "No response", null, "30-10-2026", "Raksha", "Poor communication"], ["Kabir S", "Naukri", "Rejected", null, "23-10-2026", "Priya", "Poor communication"], ["Sneha I", null, "Offer Declined", "06-10-2026", "26-10-2026", "Priya", null], ["Ananya R", "Consultant", "Screen Reject", "27-09-2026", "30-09-2026", "Raksha", "Counter offer"], ["Vikram J", "linkedin", "Offer Made", "15/10/26", "03-11-2026", "Shobika", null], ["Meera K", "Zoho Careers", "Interview R1", "18 Sep 2026", null, null, null], ["Arjun P", "LinkedIn", "Screen Reject", "07 Oct 2026", "20-10-2026", "Priya", "Poor communicat const nodes=(x,n)=>Array.from(x.getElementsByTagNameNS('*',n));let wb=await xml('xl/workbook.xml'),sheet=nodes(wb,'sheet').find(s=>s.getAttribute('name')===sheetName);if(!sheet)throw Error('Expected worksheet is missing.');let id=sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'),rel=nodes(await xml('xl/_rels/workbook.xml.rels'),'Relationship').find(v=>v.getAttribute('Id')===id).getAttribute('Target'),path=rel.startsWith('/')?rel.slice(1):'xl/'+rel;const ss=files.has('xl/sharedStrings.xml')?nodes(await xml('xl/sharedStrings.xml'),'si').map(x=>nodes(x,'t').map(t=>t.textContent).join('')):[];
return nodes(await xml(path),'row').map(row=>{const a=[];for(const cell of nodes(row,'c')){const col=cell.getAttribute('r').match(/[A-Z]+/)[0];const index=[...col].reduce((n,v)=>n*26+v.charCodeAt(0)-64,0)-1;const t=cell.getAttribute('t'),v=nodes(cell,'v')[0]?.textContent||'';a[index]=t==='s'?ss[Number(v)]:t==='inlineStr'?nodes(cell,'t').map(x=>x.textContent).join(''):v}return a});
}
async function fetchBook(i,buf=bytes(i)){const cells=await readXlsxSheet(buf,i===0?'Recruiter view':'Resumes'),head=cells.shift();const idx=h=>head.indexOf(h);const records=cells.filter(r=>r[idx('Resume ID')]).map(r=>{const id=r[idx('Resume ID')],candidate=by(id);if(!candidate)throw Error('Unrecognised sample resume ID.');return {id,name:r[idx(i===0?'Candidate':'Name')],score:i===0?Number(r[idx('Score /10')]):candidate.score}});if(records.length!==15||new Set(records.map(r=>r.id)).size!==15||records.some(r=>!Number.isFinite(r.score)||r.name!==by(r.id).name))throw Error('The 15 sample rows could not be verified.');records.sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id));const ordered=records.map(r=>({...by(r.id),score:r.score}));C.splice(0,C.length,...ordered);S.source=names[i];S.last=now();log(`Read ${records.length} Excel rows and sorted by score`);save();return records.length}
const eventName='fusion:workbook.ready';window.addEventListener(eventName,e=>{
 if(!S.hook)return;
 log(`Webhook received workbook.ready · ${e.detail.file}`);
 if(e.detail.importWorkbook)e.detail.result=fetchBook(names.indexOf(e.detail.file));
});
function hook(){if(S.hook){window.dispatchEvent(new CustomEvent(eventName,{detail:{file:S.book||'sample.xlsx'}}));if(returnTo==='wizard')workflow();else{render();modal('Webhook test received',`<p>The local listener received this sample event.</p><pre class="code">${esc(JSON.stringify({event:'workbook.ready',file:S.book||'sample.xlsx',mode:'demo'},null,2))}</pre>`)}}else{S.hook=true;log('Local workbook.ready listener connected');goBack()} }
async function run(){if(running)return;if(!(S.drive&&S.gmail&&names.includes(S.book)&&S.hook))return workflow();running=true;modal('Running workflow','<p role="status">Reading workbook and sorting sample resumes…</p>');try{const payload={file:S.book,importWorkbook:true};window.dispatchEvent(new CustomEvent(eventName,{detail:payload}));const count=await payload.result;log(`Synced ${D.replies.length} sample replies, 1 transcript and ${cleaned.length} clean funnel records`);returnTo='connect';query='';route='All routes';sort='score';modal('Workflow complete',`<div class="note">${count} resumes ranked from Excel. ${D.replies.length} replies, one interview transcript and ${cleaned.length} unique funnel records are ready for review.</div><p class="small muted">${esc(S.book)} · ${S.last} IST</p><div class="dlgActions">${btn('Open ranked candidates','go:screen','btn')}</div>`);render()}catch(e){modal('Import needs attention',`<p>${esc(e.message)}</p>${btn('Back to setup','workflow','ghost')}`)}finally{running=false}}
function download(text,name,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}
const csv=(rs,n)=>download('\uFEFF'+rs.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),n,'text/csv;charset=utf-8');
function render(){page=location.hash.slice(1);if(!Object.hasOwn(panels,page))page='overview';$('#crumb').textContent=panels[page];$('#nav').innerHTML='<h3>Workspace</h3>'+navlink('overview')+'<h3>Recruitment</h3>'+stages.map(k=>navlink(k)).join('')+'<h3>Automation</h3>'+navlink('connect');$('#main').innerHTML=({overview,screen,outreach,interviews,report,connect:links})[page]();$('#rail').classList.remove('open')}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b)return;const [a,k,v]=b.dataset.act.split(':');
switch(a){
case 'close':close();break;case 'go':returnTo='connect';jump(k);break;case 'workflow':workflow();break;case 'candidate':candidate(k);break;case 'rubric':rubric();break;
case 'review':S.queue[k]=!S.queue[k];save();candidate(k);render();break;
case 'rankcsv':csv([['Resume ID','Candidate','Score','Route','Reason','Next action'],...filtered().map(c=>[c.id,c.name,c.score,c.route,c.reason,c.action])],'Sample_Ranked_Candidates.csv');break;
case 'tab':tab=k;render();break;case 'reply':reply(+k);break;case 'handle':{let id=D.replies[k][0];S.handled[id]=replyPlan[k][3]?'Demo reply approved':'Assigned to recruiter';log(`${id} · ${S.handled[id]}`);close();render();break}
case 'inboxsync':if(!S.gmail){returnTo='inbox';picker('gmail')}else{log(`Fetched 8 sample replies via ${S.gmail} and channel fixtures`);toast('Fetched 8 sample replies, including 5 email replies.')}break;
case 'draft':if(!S.gmail){returnTo='draft:'+k;picker('gmail')}else{S.outbox[k]=S.gmail;save();modal('Demo Gmail draft',`<p class="k">Saved for ${esc(S.gmail)} · ${by(k).name}</p><p class="spaced">${templates.find(t=>t[0]===k)[2]}</p>`);render()}break;
case 'schedule':schedule();break;case 'bookslot':{let date=$('#sdate').value,slot=$('#sslot').value,who=$('#swho').value;if(!date||new Date(date+'T'+slot+':00+05:30')<=new Date()){toast('Choose a future date and time.');break}S.interview={date,slot,who};log(`Demo interview confirmed · ${date} ${slot} IST`);close();render();toast('Sample calendars and reminders updated.');break}
case 'transcript':modal('Sample interview transcript',D.transcript.map(([speaker,t])=>`<div class="item"><h3>${esc(speaker)}</h3><p>${esc(t)}</p></div>`).join(''));break;
case 'decision':modal('Interviewer review',`<p>Review the transcript and evidence, then record your decision for this sample interview.</p><label class="field">Decision<select id="decision">${['Hold for tuning follow-up','Hire','No hire'].map(t=>`<option ${S.decision===t?'selected':''}>${t}</option>`).join('')}</select></label>${btn('Save decision','savedecision','btn')}`);break;case 'savedecision':S.decision=$('#decision').value;save();close();render();break;
case 'reportapprove':S.reportReview=!S.reportReview;save();render();break;case 'print':window.print();break;
case 'cleancsv':csv([['Candidate','Source','Raw status','Highest stage','Applied on','Last updated','Recruiter','Closed reason'],...cohort().map(c=>[c.name,c.source,c.status,stageNames[c.stage],c.date,c.updated,c.owner,c.reason])],'Cleaned_Funnel.csv');break;
case 'cleanrows':modal('Cleaned funnel records',`<p class="small muted">${cohort().length} unique records · ${esc(period)}</p><div class="scroll"><table><thead><tr><th>Candidate</th><th>Source</th><th>Stage</th><th>Applied</th></tr></thead><tbody>${cohort().map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.source)}</td><td>${stageNames[c.stage]}</td><td>${c.date||'Undated'}</td></tr>`).join('')}</tbody></table></div>`);break;
case 'account':if(!$('#dialog').open)returnTo='connect';picker(k);break;
case 'choose':{const changed=S[k]!==accounts[v][1];S[k]=accounts[v][1];if(changed&&k==='drive')S.book='';log(`${k==='drive'?'Drive':'Gmail'} sample account selected`);if(returnTo==='inbox'){close();render();log('Fetched sample Gmail inbox');toast('Sample Gmail inbox synced.');returnTo='connect'}else if(returnTo.startsWith('draft:')){const id=returnTo.split(':')[1];S.outbox[id]=S.gmail;save();close();render();toast('Saved demo Gmail draft.');returnTo='connect'}else if(returnTo==='import'||returnTo==='choosefile')pickbook();else goBack();break}
case 'disconnect':S[k]=k==='hook'?false:'';if(k==='drive')S.book='';log('Disconnected demo '+k);render();break;
case 'pickbook':if(!$('#dialog').open)returnTo='choosefile';pickbook();break;
case 'driveimport':returnTo='import';pickbook();break;
case 'book':S.book=names[+k];log('Selected workbook · '+S.book);if(returnTo==='import'){try{await fetchBook(+k);jump('screen');toast('15 sample resumes imported and sorted.')}catch(err){toast(err.message)}}else goBack();break;case 'hook':if(!$('#dialog').open)returnTo='connect';hook();break;case 'run':await run();break;case 'import':importDialog();break;
}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#candidateRows').innerHTML=candidateTable()}});
document.addEventListener('change',async e=>{if(e.target.id==='sort'||e.target.id==='route'){if(e.target.id==='sort')sort=e.target.value;else route=e.target.value;$('#candidateRows').innerHTML=candidateTable()}if(e.target.id==='period'){period=e.target.value;S.reportReview=false;save();render()}if(e.target.id==='localfile'){const f=e.target.files[0];if(!f)return;try{if(f.size>200000)throw Error('Choose one of the two supplied assignment workbooks.');const data=new Uint8Array(await f.arrayBuffer());const ix=names.findIndex((_,i)=>{const b=bytes(i);return b.length===data.length&&b.every((v,j)=>v===data[j])});if(ix<0)throw Error('Use an original copy of the supplied workbook or choose the sample Drive file.');await fetchBook(ix,data);query='';route='All routes';sort='score';jump('screen');toast('Imported 15 sample resumes from Excel.')}catch(err){toast(err.message)}}});
$('#menu').onclick=()=>$('#rail').classList.toggle('open');document.addEventListener('click',e=>{if($('#rail').classList.contains('open')&&!e.target.closest('#rail,#menu'))$('#rail').classList.remove('open')});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))close()});$('#dialog').addEventListener('close',()=>{if(!$('#dialog').open)returnTo='connect'});

$('#offline').onclick=async e=>{e.preventDefault();try{let text=originalHtml;if(!text){const response=await fetch('./index.html');if(!response.ok)throw Error();text=await response.text()}download(text,'Fusion_Recruiter_Studio.html','text/html;charset=utf-8')}catch{toast('Download unavailable. Please reopen the demo and try again.')}};window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
